<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sanjay Jat. Building AI agents, RAG systems, and reliable backend systems." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fcfa"/>
      <stop offset="1" stop-color="#dff4ed"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.7" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0f766e" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <circle cx="140" cy="40" r="120" fill="#2dd4bf" fill-opacity="0.35"/>
    <circle cx="640" cy="320" r="110" fill="#22d3ee" fill-opacity="0.25"/>
    <circle cx="1130" cy="30" r="90" fill="#fbbf24" fill-opacity="0.28"/>
    <circle cx="1000" cy="300" r="100" fill="#34d399" fill-opacity="0.3"/>
  </g>

  <rect x="72" y="86" width="30" height="5" rx="2.5" fill="#0d9488"/>
  <rect x="108" y="86" width="30" height="5" rx="2.5" fill="#10b981"/>
  <rect x="144" y="86" width="30" height="5" rx="2.5" fill="#f59e0b"/>
  <text x="70" y="182" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#name)">Sanjay Jat</text>
  <text x="74" y="232" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#35594f">Building AI agents, RAG systems, and reliable backend systems.</text>

  <rect x="800" y="62" width="320" height="196" rx="12" fill="#081a16" stroke="#1f4f46" stroke-width="1.5"/>
  <circle cx="824" cy="84" r="5" fill="#f43f5e"/>
  <circle cx="842" cy="84" r="5" fill="#f59e0b"/>
  <circle cx="860" cy="84" r="5" fill="#34d399"/>
  <line x1="800" y1="104" x2="1120" y2="104" stroke="#1f4f46"/>
  <g font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="15">
    <text x="822" y="136" fill="#cbd5e1">$ agent.run(query)</text>
    <text x="822" y="166" fill="#f59e0b">retry 1/2  empty result</text>
    <text x="822" y="192" fill="#f59e0b">retry 2/2  empty result</text>
    <text x="822" y="226" fill="#5eead4">not found. no guessing.</text>
  </g>
  <rect x="1010" y="212" width="9" height="18" rx="1.5" fill="#5eead4"/>
</svg>
